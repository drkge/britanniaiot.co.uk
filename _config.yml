# britanniaiot.co.uk — GitHub Pages / Jekyll
title: Britannia IoT Solutions
description: >-
  Britannia IoT Solutions fits radar fill-level sensors to bins and containers
  across the UK, then turns the data into collection rounds that only go where
  there is waste.
url: https://britanniaiot.co.uk
lang: en-GB
locale: en_GB

# Contact and company details. Change here, not in the templates — they render
# into the footer, the contact page and the structured data.

# britanniaiot.co.uk — GitHub Pages / Jekyll
title: Britannia IoT Solutions
description: >-
  Britannia IoT Solutions fits radar fill-level sensors to bins and containers
  across the UK, then turns the data into collection rounds that only go where
  there is waste.
url: https://britanniaiot.co.uk
lang: en-GB
locale: en_GB

# Contact and company details. Change here, not in the templates — they render
# into the footer, the contact page and the structured data.
email: britianniaiot@outlook.com
phone: "+44 7949 228123"
phone_display: "07949 228123"
legal_name: Britannia IoT Solutions Ltd
company_number: "17399940"
registered_in: England and Wales
registered_office: 71-75 Shelton Street, Covent Garden, London WC2H 9JQ

og_image: /assets/img/og-default.png
css_version: "3"

plugins:
  - jekyll-sitemap

# Files that are not part of the built site.
exclude:
  - README.md
  - _tools
  - REVIEW-BEFORE-LAUNCH.md
  - serve
  - Gemfile
  - Gemfile.lock
  - vendor

# sitemap.xml is generated by jekyll-sitemap; robots.txt and llms.txt are
# hand-written and pass straight through.
defaults:
  - scope:
      path: ""
    values:
      layout: default
